{% extends "base.html" %}{% block title %}{{ who|capitalize }} Trip Login{% endblock %}{% block content %}
<div class="row justify-content-center mt-4"><div class="col-md-5 col-11"><div class="card shadow"><div class="card-body"><h3>{{ who|capitalize }} Trip Login</h3><p class="text-muted">Enter your registered User ID or mobile number, Booking ID, and 4-digit Trip PIN.</p>{% if message %}<div class="alert alert-warning">{{ message }}</div>{% endif %}<form method="post"><input name="identity" class="form-control mb-2" placeholder="User ID or registered mobile" required><input name="booking_id" class="form-control mb-2" placeholder="Booking ID" required><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" class="form-control mb-3" placeholder="4-digit Trip PIN" required><button class="btn btn-primary btn-lg w-100">Open Current Trip</button></form></div></div></div></div>
{% endblock %}
