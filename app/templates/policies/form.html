{% extends "base.html" %}
{% block title %}New Policy{% endblock %}
{% block content %}
<a href="/policies">&larr; Policies</a><h2 class="mt-2">RentaGO Policy Generator</h2>
<form method="post" action="/policies/save" class="card"><div class="card-body row g-3"><input type="hidden" name="source_policy_id" value="{{ source_id }}">
<div class="col-md-6"><label class="form-label">Policy Name</label><input name="policy_name" class="form-control" value="{{ record.policy_name or '' }}" required></div>
<div class="col-md-3"><label class="form-label">Category</label><select name="category" class="form-select">{% for c in categories %}<option {% if record.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Department</label><input name="department" class="form-control" value="{{ record.department or '' }}"></div>
<div class="col-12"><label class="form-label">Structured Policy Sections</label><input type="hidden" name="sections_json" id="sections_json"><div id="policySections"></div><button type="button" class="btn btn-outline-secondary btn-sm" id="addSection">+ Add Section</button><div class="form-text">Sections are independently editable, removable, and reorderable.</div></div>
<div class="col-md-6"><label class="form-label">Conditions JSON (optional)</label><textarea name="conditions" class="form-control" rows="4" placeholder='{"booking_type":"Corporate"}'>{{ record.conditions or '{}' }}</textarea></div>
<div class="col-md-6"><label class="form-label">Actions JSON (optional)</label><textarea name="actions" class="form-control" rows="4" placeholder='{"duration_minutes":30}'>{{ record.actions or '{}' }}</textarea></div>
<div class="col-12"><label class="form-label">Change Reason</label><textarea name="change_reason" class="form-control"></textarea></div>
</div><div class="card-footer"><button class="btn btn-primary">Save Draft</button></div></form>
<script>
const defaultSections = {{ (record.sections or sections)|tojson }};
const sections = Array.isArray(defaultSections) && defaultSections.length && typeof defaultSections[0] === 'object'
  ? defaultSections : defaultSections.map((title, i) => ({title: title, content: '', required: true, visible: true, order: i}));
function renderSections() {
  const root = document.getElementById('policySections'); root.innerHTML = '';
  sections.forEach((section, index) => {
    const card = document.createElement('div'); card.className = 'card mb-2';
    card.innerHTML = `<div class="card-body"><div class="d-flex gap-2 mb-2"><input class="form-control section-title" value="${(section.title || '').replaceAll('"','&quot;')}"><button type="button" class="btn btn-outline-secondary up">↑</button><button type="button" class="btn btn-outline-secondary down">↓</button><button type="button" class="btn btn-outline-danger delete">Delete</button></div><textarea class="form-control section-content" rows="4">${section.content || ''}</textarea></div>`;
    card.querySelector('.section-title').oninput = e => section.title = e.target.value;
    card.querySelector('.section-content').oninput = e => section.content = e.target.value;
    card.querySelector('.up').onclick = () => { if(index){ [sections[index-1],sections[index]]=[sections[index],sections[index-1]]; renderSections(); } };
    card.querySelector('.down').onclick = () => { if(index < sections.length-1){ [sections[index+1],sections[index]]=[sections[index],sections[index+1]]; renderSections(); } };
    card.querySelector('.delete').onclick = () => { sections.splice(index,1); renderSections(); };
    root.appendChild(card);
  });
}
document.getElementById('addSection').onclick = () => { sections.push({title:'New Section',content:'',required:false,visible:true,order:sections.length}); renderSections(); };
document.querySelector('form').addEventListener('submit', () => { document.getElementById('sections_json').value = JSON.stringify(sections); });
renderSections();
</script>
{% endblock %}
